# WRF 4.8.0 reference generation. The cached builds are assets of wrf-build; the output of a successful run
# is TAG-refs.tar.partNNN and TAG-refs_md5.txt on wrfref, plus an Actions log artifact.
name: wrfref
run-name: ${{ inputs.tag }}
on:
  workflow_dispatch:
    inputs:
      refs: {description: "NAME BASE FLAVOR section.key=value ... (newline- or semicolon-separated)", default: ""}
      rerun: {description: "DIR:FLAVOR ... to run again and compare", default: ""}
      prep: {description: "shell script run in /w/wrf_runs before the refs", default: ""}
      data: {description: "data tars (comma-separated, in unpack order)", default: "suite_data.tar"}
      data_tag: {description: "release of Xassemblianist/cppwrf-data", default: "data-v1"}
      src_ref: {description: "CPPWRF commit whose tools run the references", default: main}
      bundle: {description: "optional jobs release asset with the source commit at refs/heads/ci", default: ""}
      flavors: {description: "space-separated builds (r8 r8d8 r4 r8dm r8dmmove r4dmmove)", default: "r8 r8d8"}
      restart_refs: {description: "comma-separated names, none, or empty for all serial refs with steps", default: ""}
      resumed_restart_interval: {description: "optional checkpoint cadence in minutes for rsm refs", default: ""}
      portable: {description: "include the linked inputs and tables for standalone staging", type: boolean, default: false}
      tag: {description: "a unique name for the run and its assets", required: true}
permissions:
  contents: read
env:
  CI_REPO: Xassemblianist/cppwrf-data
  DATA_REPO: Xassemblianist/cppwrf-data
  GH_TOKEN: ${{ github.token }}
  SRC: ${{ inputs.src_ref }}
  BUNDLE: ${{ inputs.bundle }}
  DATA_TAG: ${{ inputs.data_tag }}
  FLS: ${{ inputs.flavors }}
  REFS: ${{ inputs.refs }}
  RESTART_REFS: ${{ inputs.restart_refs }}
  RESUMED_RESTART_INTERVAL: ${{ inputs.resumed_restart_interval }}
jobs:
  plan:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    outputs:
      flavors: ${{ steps.refs.outputs.flavors }}
      moving: ${{ steps.refs.outputs.moving }}
    steps:
      - uses: actions/checkout@v4
      - id: refs
        env: {TAG: "${{ inputs.tag }}"}
        run: |
          [[ "$TAG" =~ ^[A-Za-z0-9][A-Za-z0-9_.-]*$ ]]
          [[ -z "$RESUMED_RESTART_INTERVAL" || "$RESUMED_RESTART_INTERVAL" =~ ^[1-9][0-9]*$ ]]
          printf '%s\n' "$REFS" | python3 ci/wrfref_refs.py - --flavors "$FLS" --restart-refs "$RESTART_REFS" --plan plan
          cat plan/outputs >> "$GITHUB_OUTPUT"

  wrf:
    needs: plan
    permissions:
      contents: write
    runs-on: ubuntu-latest
    timeout-minutes: 150
    strategy:
      fail-fast: false
      matrix:
        flavor: ${{ fromJSON(needs.plan.outputs.flavors) }}
    steps:
      - uses: actions/checkout@v4
        with: {path: ci}
      - name: build or fetch
        env: {FL: "${{ matrix.flavor }}"}
        run: |
          asset=$(bash ci/ci/wrf_build_asset.sh "$FL")
          read -r name recipe <<< "$asset"
          gh release view wrf-build -R "$CI_REPO" > /dev/null 2>&1 ||
            gh release create wrf-build -R "$CI_REPO" --title wrf-build --notes "WRF v4.8.0 builds (the tree after ./compile em_real)" ||
            gh release view wrf-build -R "$CI_REPO" > /dev/null
          has_asset() {
            gh release view wrf-build -R "$CI_REPO" --json assets --jq '.assets[].name' | grep -Fx "$name" > /dev/null
          }
          if has_asset; then echo "$name exists"; exit 0; fi
          mkdir -p out
          trap 'sudo chown -R "$(id -u):$(id -g)" out; tail -30 out/*.log' EXIT
          docker run --rm -v "$GITHUB_WORKSPACE:/w" -e FL -e "RECIPE=$recipe" -e "ASSET=$name" debian:13 bash -e -o pipefail -c '
            dest=/w/wrf/WRF-4.8.0-$FL
            rc=0
            bash "/w/ci/ci/$RECIPE" "$FL" "$dest" > "/w/out/build_$FL.log" 2>&1 || rc=$?
            for f in configure.wrf configure.out compile.log; do
              if [ -f "$dest/$f" ]; then cp "$dest/$f" /w/out/; fi
            done
            test "$rc" = 0
            test -x "$dest/main/wrf.exe"
            tar cf - -C /w/wrf "WRF-4.8.0-$FL" | zstd -q -T0 -10 -o "/w/$ASSET"
          '
          # Another dispatch may have built the same immutable cache key.
          if ! has_asset; then gh release upload wrf-build "$name" -R "$CI_REPO" || has_asset; fi
      - uses: actions/upload-artifact@v4
        if: always()
        with: {name: "build-${{ matrix.flavor }}", path: out/, retention-days: 30, if-no-files-found: ignore}

  repro:
    needs: [plan, wrf]
    if: needs.plan.outputs.moving == 'true'
    runs-on: ubuntu-latest
    timeout-minutes: 150
    steps:
      - uses: actions/checkout@v4
        with: {path: ci}
      - name: N3 serial vs one-rank dmpar
        env: {DATA: matrix_nest.tar}
        run: bash ci/ci/wrfref_host.sh repro
      - uses: actions/upload-artifact@v4
        if: always()
        with: {name: wrfref-repro, path: out/, retention-days: 30}

  run:
    needs: [plan, wrf, repro]
    if: ${{ !cancelled() && needs.wrf.result == 'success' && (needs.repro.result == 'success' || (needs.repro.result == 'skipped' && needs.plan.outputs.moving == 'false')) }}
    permissions:
      contents: write
    runs-on: ubuntu-latest
    timeout-minutes: 150
    steps:
      - name: free disk
        run: |
          sudo rm -rf /usr/share/dotnet /usr/local/lib/android /opt/ghc /usr/local/.ghcup /opt/hostedtoolcache \
            /usr/local/share/boost /usr/local/share/swift /usr/local/julia* /usr/local/share/powershell /usr/local/share/chromium
          df -h /
      - uses: actions/checkout@v4
        with: {path: ci}
      - name: WRF runs (Debian 13 container)
        env: {DATA: "${{ inputs.data }}", PREP: "${{ inputs.prep }}", RERUN: "${{ inputs.rerun }}", PORTABLE: "${{ inputs.portable }}"}
        run: bash ci/ci/wrfref_host.sh refs
      - name: assets
        env: {TAG: "${{ inputs.tag }}"}
        run: |
          [ -f out/refs_md5.txt ] || exit 0
          gh release view wrfref -R "$CI_REPO" > /dev/null 2>&1 ||
            gh release create wrfref -R "$CI_REPO" --title wrfref --notes "WRF reference runs of the wrfref workflow" ||
            gh release view wrfref -R "$CI_REPO" > /dev/null
          for f in fetch/refs.tar.part*; do
            mv "$f" "fetch/$TAG-$(basename "$f")"
            gh release upload wrfref "fetch/$TAG-$(basename "$f")" -R "$CI_REPO" --clobber
          done
          cp out/refs_md5.txt "fetch/$TAG-refs_md5.txt"
          gh release upload wrfref "fetch/$TAG-refs_md5.txt" -R "$CI_REPO" --clobber
      - name: logs
        if: always()
        run: |
          cat out/setup.out out/data.txt out/prep.out out/refs.out out/moves.log out/rerun.log 2>/dev/null || true
      - uses: actions/upload-artifact@v4
        if: always()
        with: {name: wrfref-logs, path: out/, retention-days: 30}
